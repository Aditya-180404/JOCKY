name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ─── Linux Rust checks ──────────────────────────────────────────────────────
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Build without LLVM (default feature set — same as local dev)
      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build release
        run: cargo build --workspace --release

      # ── Linux acceptance tests ───────────────────────────────────────────────
      - name: jockey --version
        run: ./target/release/jockey --version

      - name: jockey doctor
        run: ./target/release/jockey doctor

      - name: jockey check (example)
        run: ./target/release/jockey check examples/complete_forensic_triage.jy

      - name: jockey compile linux-x64
        run: ./target/release/jockey compile examples/complete_forensic_triage.jy --target linux --arch x64 --output ./ci-build/

      - name: verify artifact is ELF
        run: |
          file ./ci-build/complete_forensic_triage-linux-x64 | grep -i ELF

      - name: jockey run
        run: ./target/release/jockey run examples/complete_forensic_triage.jy --output ./ci-build/

      - name: jockey verify evidence
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | head -1)
          META="${EVIDENCE}.meta.json"
          ./target/release/jockey evidence verify "${EVIDENCE}" --meta "${META}"

      - name: tamper test (expect INVALID)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | head -1)
          META="${EVIDENCE}.meta.json"
          cp "${EVIDENCE}" /tmp/tampered.json
          echo '"tampered_field": true' >> /tmp/tampered.json
          if ./target/release/jockey evidence verify /tmp/tampered.json --meta "${META}" 2>/dev/null; then
            echo "ERROR: tampered evidence should have failed verification" && exit 1
          else
            echo "✓ Tamper detection working correctly"
          fi

  # ─── Windows Rust checks ─────────────────────────────────────────────────────
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build release
        run: cargo build --workspace --release

      # ── Windows acceptance tests ─────────────────────────────────────────────
      - name: jockey --version
        run: .\target\release\jockey.exe --version

      - name: jockey doctor
        run: .\target\release\jockey.exe doctor

      - name: jockey check (example)
        run: .\target\release\jockey.exe check examples\complete_forensic_triage.jy

      - name: jockey compile windows-x64
        run: .\target\release\jockey.exe compile examples\complete_forensic_triage.jy --target windows --arch x64 --output .\ci-build\

      - name: verify artifact is PE
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes(".\ci-build\complete_forensic_triage-windows-x64.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "Artifact is not a valid PE (MZ) file"
            exit 1
          }
          Write-Host "✓ PE header verified (MZ magic present)"

      - name: jockey run
        run: .\target\release\jockey.exe run examples\complete_forensic_triage.jy --output .\ci-build\

      - name: jockey verify evidence
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json | Where-Object { $_.Name -notmatch "meta|manifest" } | Select-Object -First 1).FullName
          $meta = "$evidence.meta.json"
          .\target\release\jockey.exe evidence verify $evidence --meta $meta

      - name: tamper test (expect INVALID)
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json | Where-Object { $_.Name -notmatch "meta|manifest" } | Select-Object -First 1).FullName
          $meta = "$evidence.meta.json"
          $tampered = "$env:TEMP\tampered.json"
          Copy-Item $evidence $tampered
          Add-Content $tampered '"tampered_field": true'
          $result = .\target\release\jockey.exe evidence verify $tampered --meta $meta 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "ERROR: tampered evidence should have failed"; exit 1
          } else {
            Write-Host "✓ Tamper detection working correctly"
          }

      # ── Windows packaging ────────────────────────────────────────────────────
      - name: build Windows distribution archive
        run: powershell.exe -ExecutionPolicy Bypass -File packaging\build-win.ps1

      - name: verify archive exists and has content
        shell: pwsh
        run: |
          if (-not (Test-Path .\jockey_0.1.0_windows_amd64.zip)) {
            Write-Error "Package not created"; exit 1
          }
          $size = (Get-Item .\jockey_0.1.0_windows_amd64.zip).Length
          if ($size -lt 100000) {
            Write-Error "Package too small ($size bytes)"; exit 1
          }
          Write-Host "✓ Windows package ($size bytes)"

      - name: Upload Windows distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: jockey-windows-x64-zip
          path: jockey_0.1.0_windows_amd64.zip
          if-no-files-found: error

  # ─── Web checks ──────────────────────────────────────────────────────────────
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ─── Debian package build ─────────────────────────────────────────────────────
  debian-package:
    name: Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release CLI
        run: cargo build --release -p jockey-cli

      - name: Install dpkg-deb
        run: sudo apt-get install -y dpkg

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info jockey_0.1.0_amd64.deb
          dpkg-deb --contents jockey_0.1.0_amd64.deb

      - name: Install package
        run: sudo dpkg -i jockey_0.1.0_amd64.deb

      - name: Verify installed binary
        run: |
          jockey --version
          jockey doctor
          jockey check examples/complete_forensic_triage.jy

      - name: Remove package
        run: sudo dpkg -r jockey

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jockey-debian-amd64-deb
          path: jockey_0.1.0_amd64.deb
          if-no-files-found: error
