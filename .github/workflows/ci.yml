name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ─── Linux Rust checks ──────────────────────────────────────────────────────
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup LLVM 21 toolchain (Linux)
        run: |
          set -e
          python3 scripts/setup-llvm-linux.py
          echo "LLVM_SYS_211_PREFIX=/opt/llvm21" >> "$GITHUB_ENV"
          echo "/opt/llvm21/bin" >> "$GITHUB_PATH"

      - name: Print toolchain versions
        run: |
          echo "=== Toolchain Versions ==="
          rustc --version
          cargo --version
          /opt/llvm21/bin/llvm-config --version || true
          clang --version || true

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test (--all-features)
        run: cargo test --workspace --all-features

      - name: build release
        run: cargo build --workspace --release

      # ── Linux acceptance tests ───────────────────────────────────────────────
      - name: jocky --version
        run: ./target/release/jocky --version

      - name: jocky doctor
        run: ./target/release/jocky doctor

      - name: jocky check (example)
        run: ./target/release/jocky check examples/complete_forensic_triage.jy

      - name: jocky compile linux-x64
        run: ./target/release/jocky compile examples/complete_forensic_triage.jy --target linux --arch x64 --output ./ci-build/

      - name: verify artifact is ELF
        run: |
          file ./ci-build/complete_forensic_triage-linux-x64 | grep -i ELF

      - name: jocky run
        run: ./target/release/jocky run examples/complete_forensic_triage.jy --output ./ci-build/

      - name: jocky verify evidence
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | head -1)
          META="${EVIDENCE}.meta.json"
          ./target/release/jocky evidence verify "${EVIDENCE}" --meta "${META}"

      - name: tamper test (expect INVALID)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | head -1)
          META="${EVIDENCE}.meta.json"
          TAMPERED=/tmp/tampered.json
          jq '.[0] |= (. + {"ci_tamper_probe": true})' "${EVIDENCE}" > "${TAMPERED}"
          jq -e 'type == "array" and length > 0 and .[0].ci_tamper_probe == true' "${TAMPERED}" >/dev/null
          if ./target/release/jocky evidence verify "${TAMPERED}" --meta "${META}" 2>/dev/null; then
            echo "ERROR: tampered evidence should have failed verification" && exit 1
          else
            echo "✓ Tamper detection working correctly"
          fi

  # ─── Windows Rust checks ─────────────────────────────────────────────────────
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup LLVM 21 toolchain (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\setup-llvm-win.py
          "LLVM_SYS_211_PREFIX=C:\LLVM21" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\LLVM21\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Print toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== Toolchain Versions ==="
          rustc --version
          cargo --version
          & "C:\LLVM21\bin\llvm-config.exe" --version
          clang --version

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy (--all-features)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test (--all-features)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo test --workspace --all-features

      - name: build release
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo build --workspace --release

      # ── Windows acceptance tests ─────────────────────────────────────────────
      - name: jocky --version
        run: .\target\release\jocky.exe --version

      - name: jocky doctor
        run: .\target\release\jocky.exe doctor

      - name: jocky check (example)
        run: .\target\release\jocky.exe check examples\complete_forensic_triage.jy

      - name: jocky compile windows-x64
        run: .\target\release\jocky.exe compile examples\complete_forensic_triage.jy --target windows --arch x64 --output .\ci-build\

      - name: verify artifact is PE
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes(".\ci-build\complete_forensic_triage-windows-x64.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "Artifact is not a valid PE (MZ) file"
            exit 1
          }
          Write-Host "✓ PE header verified (MZ magic present)"

      - name: jocky run
        run: .\target\release\jocky.exe run examples\complete_forensic_triage.jy --output .\ci-build\

      - name: jocky verify evidence
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json | Where-Object { $_.Name -notmatch "meta|manifest" } | Select-Object -First 1).FullName
          $meta = "$evidence.meta.json"
          .\target\release\jocky.exe evidence verify $evidence --meta $meta

      - name: tamper test (expect INVALID)
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json | Where-Object { $_.Name -notmatch "meta|manifest" } | Select-Object -First 1).FullName
          $meta = "$evidence.meta.json"
          $tampered = "$env:TEMP\tampered.json"
          $records = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($records -isnot [array] -or $records.Count -eq 0) {
            throw "Evidence must be a non-empty JSON array before tampering"
          }
          $records[0] | Add-Member -NotePropertyName ci_tamper_probe -NotePropertyValue $true -Force
          $tamperedJson = ConvertTo-Json -InputObject $records -Depth 100
          [System.IO.File]::WriteAllText($tampered, $tamperedJson, [System.Text.UTF8Encoding]::new($false))
          $null = Get-Content $tampered -Raw | ConvertFrom-Json

          $result = & .\target\release\jocky.exe evidence verify $tampered --meta $meta 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Error "ERROR: tampered evidence should have failed"
            exit 1
          }

          Write-Host "✓ Tamper detection working correctly (exit code $exitCode)"
          Write-Host $result
          exit 0

      - name: Authenticode Signing Pipeline (Dev / Release)
        shell: pwsh
        run: |
          $mandatory = if ($env:GITHUB_REF -like "refs/tags/*") { "-Mandatory" } else { "" }
          powershell.exe -ExecutionPolicy Bypass -File scripts\sign-windows.ps1 $mandatory

      # ── Windows packaging & clean extraction validation ──────────────────────
      - name: build Windows distribution archive
        run: powershell.exe -ExecutionPolicy Bypass -File packaging\build-win.ps1

      - name: validate extracted Windows distribution package
        shell: pwsh
        run: |
          powershell.exe -ExecutionPolicy Bypass -File tests\verify-windows-package.ps1

      - name: Upload Windows distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: jocky-windows-x64-zip
          path: jocky_0.1.0_windows_amd64.zip
          if-no-files-found: error

  # ─── Web checks ──────────────────────────────────────────────────────────────
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Print Node & NPM versions
        run: |
          node --version
          npm --version

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ─── Debian package build ─────────────────────────────────────────────────────
  debian-package:
    name: Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Print toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Build release CLI
        run: cargo build --release -p jocky-cli

      - name: Install dpkg-deb
        run: sudo apt-get install -y dpkg

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info jocky_0.1.0_amd64.deb
          dpkg-deb --contents jocky_0.1.0_amd64.deb

      - name: Install package
        run: sudo dpkg -i jocky_0.1.0_amd64.deb

      - name: Verify installed binary
        run: |
          jocky --version
          jocky doctor
          jocky capabilities --format json | jq '. | length'
          jocky check examples/complete_forensic_triage.jy

      - name: Remove package
        run: sudo dpkg -r jocky

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jocky-debian-amd64-deb
          path: jocky_0.1.0_amd64.deb
          if-no-files-found: error
