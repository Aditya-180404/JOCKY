name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# ─── Shared defaults ──────────────────────────────────────────────────────────
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ══════════════════════════════════════════════════════════════════════════════
  # Linux — Rust checks + acceptance tests
  # ══════════════════════════════════════════════════════════════════════════════
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup LLVM 21 toolchain (Linux)
        run: |
          set -e
          python3 scripts/setup-llvm-linux.py
          echo "LLVM_SYS_211_PREFIX=/opt/llvm21" >> "$GITHUB_ENV"
          echo "/opt/llvm21/bin" >> "$GITHUB_PATH"

      - name: Print toolchain versions
        run: |
          echo "=== Toolchain Versions ==="
          rustc --version
          cargo --version
          /opt/llvm21/bin/llvm-config --version || true
          clang --version || true

      # ── Code quality ───────────────────────────────────────────────────────
      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ── Unit + integration tests (workspace-wide) ──────────────────────────
      - name: test workspace (--all-features)
        run: cargo test --workspace --all-features

      # ── Per-crate isolation tests ──────────────────────────────────────────
      - name: unit tests — lexer
        run: cargo test -p jocky-lexer --all-features

      - name: unit tests — parser
        run: cargo test -p jocky-parser --all-features

      - name: unit tests — AST
        run: cargo test -p jocky-ast --all-features

      - name: unit tests — semantic analyser
        run: cargo test -p jocky-semantic --all-features

      - name: unit tests — IR
        run: cargo test -p jocky-ir --all-features

      - name: unit tests — HIR
        run: cargo test -p jocky-hir --all-features

      - name: unit tests — MIR
        run: cargo test -p jocky-mir --all-features

      - name: unit tests — backend (Rust + LLVM)
        run: cargo test -p jocky-backend --all-features

      - name: integration tests — backend e2e pipeline
        run: cargo test -p jocky-backend --test e2e_pipeline --all-features

      - name: integration tests — backend native e2e
        run: cargo test -p jocky-backend --test native_e2e --all-features

      - name: integration tests — backend LLVM golden
        run: cargo test -p jocky-backend --test llvm_golden --all-features

      - name: integration tests — backend MIR completeness
        run: cargo test -p jocky-backend --test mir_completeness --all-features

      - name: integration tests — backend Rust/LLVM parity
        run: cargo test -p jocky-backend --test rust_backend_parity --all-features

      - name: integration tests — backend source independence
        run: cargo test -p jocky-backend --test source_independence --all-features

      - name: integration tests — backend timeline pipeline
        run: cargo test -p jocky-backend --test timeline_pipeline --all-features

      - name: unit tests — runtime (core)
        run: cargo test -p jocky-runtime --all-features

      - name: unit tests — runtime evidence
        run: cargo test -p jocky-runtime-evidence --all-features

      - name: integration tests — evidence deep verify
        run: cargo test -p jocky-runtime-evidence --test deep_verify --all-features

      - name: integration tests — evidence bundle lifecycle
        run: cargo test -p jocky-runtime-evidence --test evidence_bundle_lifecycle --all-features

      - name: unit tests — runtime LotL
        run: cargo test -p jocky-runtime-lotl --all-features

      - name: integration tests — LotL full suite
        run: cargo test -p jocky-runtime-lotl --test integration --all-features

      - name: unit tests — runtime process
        run: cargo test -p jocky-runtime-process --all-features

      - name: unit tests — runtime network
        run: cargo test -p jocky-runtime-network --all-features

      - name: unit tests — runtime filesystem
        run: cargo test -p jocky-runtime-filesystem --all-features

      - name: unit tests — runtime memory
        run: cargo test -p jocky-runtime-memory --all-features

      - name: unit tests — runtime system
        run: cargo test -p jocky-runtime-system --all-features

      - name: unit tests — runtime drivers
        run: cargo test -p jocky-runtime-drivers --all-features

      - name: unit tests — runtime timeline
        run: cargo test -p jocky-runtime-timeline --all-features

      - name: unit tests — runtime artifacts
        run: cargo test -p jocky-runtime-artifacts --all-features

      - name: unit tests — runtime correlation
        run: cargo test -p jocky-runtime-correlation --all-features

      - name: integration tests — correlation investigation pipeline
        run: cargo test -p jocky-runtime-correlation --test investigation_data_pipeline --all-features

      - name: unit tests — runtime capabilities
        run: cargo test -p jocky-runtime-capabilities --all-features

      - name: unit tests — runtime security
        run: cargo test -p jocky-runtime-security --all-features

      - name: unit tests — runtime services
        run: cargo test -p jocky-runtime-services --all-features

      - name: unit tests — runtime users
        run: cargo test -p jocky-runtime-users --all-features

      - name: unit tests — runtime auth
        run: cargo test -p jocky-runtime-auth --all-features

      - name: unit tests — runtime registry
        run: cargo test -p jocky-runtime-registry --all-features

      - name: unit tests — runtime logs
        run: cargo test -p jocky-runtime-logs --all-features

      - name: unit tests — API
        run: cargo test -p jocky-api --all-features

      - name: unit tests — shared-types
        run: cargo test -p jocky-shared-types --all-features

      # ── Release build ──────────────────────────────────────────────────────
      - name: build release
        run: cargo build --workspace --release

      # ── Binary smoke tests ─────────────────────────────────────────────────
      - name: jocky --version
        run: ./target/release/jocky --version

      - name: jocky doctor
        run: ./target/release/jocky doctor

      - name: jocky capabilities (table)
        run: ./target/release/jocky capabilities

      - name: jocky capabilities (json) — count >= 247
        run: |
          COUNT=$(./target/release/jocky capabilities --format json | jq '. | length')
          echo "Capability count: $COUNT"
          [ "$COUNT" -ge 247 ]

      # ── Check ALL 14 example .jy files ────────────────────────────────────
      - name: jocky check — all examples
        run: |
          set -e
          PASS=0; FAIL=0
          for JY in examples/*.jy; do
            if ./target/release/jocky check "$JY" 2>&1; then
              echo "PASS: $JY"
              PASS=$((PASS+1))
            else
              echo "FAIL: $JY"
              FAIL=$((FAIL+1))
            fi
          done
          echo "Check results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ]

      # ── Compile acceptance tests ───────────────────────────────────────────
      - name: jocky compile linux-x64 (complete_forensic_triage)
        run: |
          mkdir -p ./ci-build
          ./target/release/jocky compile examples/complete_forensic_triage.jy \
            --target linux --arch x64 --output ./ci-build/

      - name: verify artifact is ELF
        run: |
          file ./ci-build/complete_forensic_triage-linux-x64 | grep -i ELF

      - name: jocky compile linux-x64 (stealth_adversary_detection)
        run: |
          ./target/release/jocky compile examples/stealth_adversary_detection.jy \
            --target linux --arch x64 --output ./ci-build/

      - name: verify stealth artifact is ELF
        run: |
          file ./ci-build/stealth_adversary_detection-linux-x64 | grep -i ELF

      - name: jocky compile linux-x64 (process_triage)
        run: |
          ./target/release/jocky compile examples/process_triage.jy \
            --target linux --arch x64 --output ./ci-build/

      # ── Polymorphic build verification ────────────────────────────────────
      - name: polymorphic builds produce distinct hashes
        run: bash tests/verify-polymorphic-builds.sh

      # ── Run & evidence collection ─────────────────────────────────────────
      - name: jocky run (collect real evidence)
        run: ./target/release/jocky run examples/complete_forensic_triage.jy --output ./ci-build/

      - name: jocky verify evidence (SHA-256 + Merkle)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          META="${EVIDENCE}.meta.json"
          echo "Verifying: $EVIDENCE"
          ./target/release/jocky evidence verify "${EVIDENCE}" --meta "${META}"

      - name: jocky verify evidence --deep (per-item Merkle proof)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          META="${EVIDENCE}.meta.json"
          ./target/release/jocky evidence verify "${EVIDENCE}" --meta "${META}" --deep

      - name: tamper test (expect INVALID)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          META="${EVIDENCE}.meta.json"
          TAMPERED=/tmp/tampered.json
          jq '.[0] |= (. + {"ci_tamper_probe": true})' "${EVIDENCE}" > "${TAMPERED}"
          jq -e 'type == "array" and length > 0 and .[0].ci_tamper_probe == true' "${TAMPERED}" > /dev/null
          if ./target/release/jocky evidence verify "${TAMPERED}" --meta "${META}" 2>/dev/null; then
            echo "ERROR: tampered evidence was accepted as VALID — tamper detection broken" >&2
            exit 1
          fi
          echo "Tamper detection working correctly (verify correctly rejected tampered evidence)"
          exit 0

      # ── Report generation ─────────────────────────────────────────────────
      - name: report generate (terminal)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          ./target/release/jocky report generate --format terminal "${EVIDENCE}"

      - name: report generate (markdown)
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          ./target/release/jocky report generate --format markdown \
            --output ./ci-build/report.md "${EVIDENCE}"
          [ -f ./ci-build/report.md ]

      - name: report generate (json) — validate valid JSON
        run: |
          EVIDENCE=$(ls ./ci-build/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          ./target/release/jocky report generate --format json \
            --output ./ci-build/report.json "${EVIDENCE}"
          [ -f ./ci-build/report.json ]
          jq '.' ./ci-build/report.json > /dev/null

      # ── Upload build artifacts ─────────────────────────────────────────────
      - name: Upload Linux CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jocky-linux-ci-artifacts
          path: ./ci-build/
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════════════
  # Windows — Rust checks + acceptance tests
  # ══════════════════════════════════════════════════════════════════════════════
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup LLVM 21 toolchain (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts\setup-llvm-win.py
          "LLVM_SYS_211_PREFIX=C:\LLVM21" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\LLVM21\bin"                  | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Print toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== Toolchain Versions ==="
          rustc --version
          cargo --version
          & "C:\LLVM21\bin\llvm-config.exe" --version
          clang --version

      - name: Allow jocky.exe through Windows Firewall (inbound)
        shell: pwsh
        run: |
          # Allow inbound TCP connections to jocky.exe so CI tests are not
          # blocked by Windows Firewall. The rule is scoped to the process path
          # once the binary is built; we also pre-allow the release path.
          $exePath = "$env:GITHUB_WORKSPACE\target\release\jocky.exe"
          New-NetFirewallRule `
            -DisplayName  "JOCKY CI – jocky.exe inbound (TCP)" `
            -Direction    Inbound `
            -Protocol     TCP `
            -Action       Allow `
            -Program      $exePath `
            -Profile      Any `
            -ErrorAction  SilentlyContinue | Out-Null
          Write-Host "Firewall inbound rule created for: $exePath"

      # ── Code quality ───────────────────────────────────────────────────────
      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy (--all-features)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ── Unit + integration tests ───────────────────────────────────────────
      - name: test workspace (--all-features)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo test --workspace --all-features

      # ── Per-crate isolation (Windows-specific paths exercised) ─────────────
      - name: unit tests — LotL (Windows path coverage)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo test -p jocky-runtime-lotl --all-features

      - name: integration tests — LotL full suite (Windows)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo test -p jocky-runtime-lotl --test integration --all-features

      - name: unit tests — backend (Windows)
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo test -p jocky-backend --all-features

      # ── Release build ──────────────────────────────────────────────────────
      - name: build release
        shell: pwsh
        run: |
          $env:LLVM_SYS_211_PREFIX = "C:\LLVM21"
          $env:PATH = "C:\LLVM21\bin;$env:PATH"
          cargo build --workspace --release

      # ── Binary smoke tests ─────────────────────────────────────────────────
      - name: jocky --version
        run: .\target\release\jocky.exe --version

      - name: jocky doctor
        run: .\target\release\jocky.exe doctor

      - name: jocky capabilities (json) — count >= 172
        shell: pwsh
        run: |
          $count = (.\target\release\jocky.exe capabilities --format json | ConvertFrom-Json).Count
          Write-Host "Capability count: $count"
          if ($count -lt 172) { Write-Error "Expected >= 172 capabilities, got $count"; exit 1 }

      # ── Check ALL 14 example .jy files ────────────────────────────────────
      - name: jocky check — all examples (Windows)
        shell: pwsh
        run: |
          $pass = 0; $fail = 0
          Get-ChildItem examples\*.jy | ForEach-Object {
            $result = & .\target\release\jocky.exe check $_.FullName 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "PASS: $($_.Name)"
              $pass++
            } else {
              Write-Host "FAIL: $($_.Name): $result"
              $fail++
            }
          }
          Write-Host "Check results: $pass passed, $fail failed"
          if ($fail -gt 0) { exit 1 }

      # ── Compile acceptance tests ───────────────────────────────────────────
      - name: jocky compile windows-x64 (complete_forensic_triage)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\ci-build | Out-Null
          .\target\release\jocky.exe compile examples\complete_forensic_triage.jy `
            --target windows --arch x64 --output .\ci-build\

      - name: verify artifact is PE
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes(".\ci-build\complete_forensic_triage-windows-x64.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "Artifact is not a valid PE (MZ) file"
            exit 1
          }
          Write-Host "PE header verified (MZ magic present)"

      - name: jocky compile windows-x64 (stealth_adversary_detection)
        shell: pwsh
        run: |
          .\target\release\jocky.exe compile examples\stealth_adversary_detection.jy `
            --target windows --arch x64 --output .\ci-build\

      - name: verify stealth artifact is PE
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes(".\ci-build\stealth_adversary_detection-windows-x64.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "stealth artifact is not a valid PE (MZ) file"
            exit 1
          }
          Write-Host "Stealth PE header verified"

      # ── Run & evidence collection ─────────────────────────────────────────
      - name: jocky run (collect real evidence)
        run: .\target\release\jocky.exe run examples\complete_forensic_triage.jy --output .\ci-build\

      - name: jocky verify evidence (SHA-256 + Merkle)
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json |
            Where-Object { $_.Name -notmatch "meta|manifest|bundle|report" } |
            Select-Object -First 1).FullName
          $meta = "$evidence.meta.json"
          Write-Host "Verifying: $evidence"
          .\target\release\jocky.exe evidence verify $evidence --meta $meta

      - name: jocky verify evidence --deep (Merkle proof)
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json |
            Where-Object { $_.Name -notmatch "meta|manifest|bundle|report" } |
            Select-Object -First 1).FullName
          $meta = "$evidence.meta.json"
          .\target\release\jocky.exe evidence verify $evidence --meta $meta --deep

      - name: tamper test (expect INVALID)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $evidence = (Get-ChildItem .\ci-build\*.json |
            Where-Object { $_.Name -notmatch 'meta|manifest|bundle|report' } |
            Select-Object -First 1).FullName

          if (-not $evidence) { Write-Error 'No evidence file found'; exit 1 }

          $meta     = "$evidence.meta.json"
          $tampered = Join-Path $env:TEMP 'jocky-ci-tampered.json'

          $records = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($records -isnot [array] -or $records.Count -eq 0) {
            Write-Error 'Evidence must be a non-empty JSON array'; exit 1
          }
          $records[0] | Add-Member -NotePropertyName ci_tamper_probe -NotePropertyValue $true -Force
          $tamperedJson = ConvertTo-Json -InputObject $records -Depth 100
          [System.IO.File]::WriteAllText($tampered, $tamperedJson, [System.Text.UTF8Encoding]::new($false))

          $result   = & .\target\release\jocky.exe evidence verify $tampered --meta $meta 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Error "FAIL: tampered evidence was accepted as VALID — tamper detection broken"
            exit 1
          }

          Write-Host "Tamper detection working correctly (jocky.exe exited $exitCode)"
          Write-Host $result
          exit 0

      # ── Report generation ─────────────────────────────────────────────────
      - name: report generate (terminal + markdown + json)
        shell: pwsh
        run: |
          $evidence = (Get-ChildItem .\ci-build\*.json |
            Where-Object { $_.Name -notmatch "meta|manifest|bundle|report" } |
            Select-Object -First 1).FullName

          .\target\release\jocky.exe report generate --format terminal $evidence
          Write-Host "Terminal report OK"

          .\target\release\jocky.exe report generate --format markdown `
            --output .\ci-build\report.md $evidence
          if (-not (Test-Path .\ci-build\report.md)) { Write-Error "Markdown report missing"; exit 1 }
          Write-Host "Markdown report OK"

          .\target\release\jocky.exe report generate --format json `
            --output .\ci-build\report.json $evidence
          if (-not (Test-Path .\ci-build\report.json)) { Write-Error "JSON report missing"; exit 1 }
          Get-Content .\ci-build\report.json | ConvertFrom-Json | Out-Null
          Write-Host "JSON report is valid JSON"

      # ── Authenticode signing + packaging ──────────────────────────────────
      - name: Authenticode Signing Pipeline (Dev / Release)
        shell: pwsh
        run: |
          $args = @("-ExecutionPolicy", "Bypass", "-File", "scripts\sign-windows.ps1")
          if ($env:GITHUB_REF -like "refs/tags/*") { $args += "-Mandatory" }
          powershell.exe @args

      - name: build Windows distribution archive
        run: powershell.exe -ExecutionPolicy Bypass -File packaging\build-win.ps1

      - name: validate extracted Windows distribution package
        shell: pwsh
        run: |
          powershell.exe -ExecutionPolicy Bypass -File tests\verify-windows-package.ps1 -ZipPath .\jocky_0.1.0_windows_amd64.zip

      - name: Upload Windows distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: jocky-windows-x64-zip
          path: jocky_0.1.0_windows_amd64.zip
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════════
  # Web — TypeScript, lint, build
  # ══════════════════════════════════════════════════════════════════════════════
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Print Node & NPM versions
        run: |
          node --version
          npm --version

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: build (tsc type-check + vite bundle)
        run: npm run build

      - name: verify dist output exists
        run: |
          test -d dist
          test -f dist/index.html

  # ══════════════════════════════════════════════════════════════════════════════
  # Debian package — build, install, verify, remove
  # ══════════════════════════════════════════════════════════════════════════════
  debian-package:
    name: Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # LLVM required so the binary built here has all features
      - name: Setup LLVM 21 toolchain (Debian job)
        run: |
          set -e
          python3 scripts/setup-llvm-linux.py
          echo "LLVM_SYS_211_PREFIX=/opt/llvm21" >> "$GITHUB_ENV"
          echo "/opt/llvm21/bin" >> "$GITHUB_PATH"

      - name: Print toolchain versions
        run: |
          rustc --version
          cargo --version
          /opt/llvm21/bin/llvm-config --version || true

      - name: Build release CLI
        run: cargo build --release -p jocky-cli

      - name: Install dpkg-deb
        run: sudo apt-get install -y dpkg

      - name: Build Debian package
        run: bash packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info jocky_0.1.0_amd64.deb
          dpkg-deb --contents jocky_0.1.0_amd64.deb

      - name: Install package
        run: sudo dpkg -i jocky_0.1.0_amd64.deb

      - name: Verify installed binary — version + doctor
        run: |
          jocky --version
          jocky doctor

      - name: Verify installed binary — capabilities >= 247
        run: |
          COUNT=$(jocky capabilities --format json | jq '. | length')
          echo "Capability count: $COUNT"
          [ "$COUNT" -ge 247 ]

      - name: Verify installed binary — check all examples
        run: |
          PASS=0; FAIL=0
          for JY in examples/*.jy; do
            if jocky check "$JY" 2>&1; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
            fi
          done
          echo "Check results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ]

      - name: Verify installed binary — run investigation + verify evidence
        run: |
          mkdir -p /tmp/deb-evidence
          jocky run examples/basic_system_triage.jy --output /tmp/deb-evidence/
          EVIDENCE=$(ls /tmp/deb-evidence/*.json | grep -v meta | grep -v manifest | grep -v bundle | head -1)
          META="${EVIDENCE}.meta.json"
          jocky evidence verify "${EVIDENCE}" --meta "${META}"

      - name: Remove package
        run: sudo dpkg -r jocky

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jocky-debian-amd64-deb
          path: jocky_0.1.0_amd64.deb
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════════
  # Fast per-module job — no LLVM needed — catches regressions early
  # ══════════════════════════════════════════════════════════════════════════════
  unit-tests-fast:
    name: Unit Tests (fast — no LLVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: unit tests — lexer
        run: cargo test -p jocky-lexer

      - name: unit tests — parser
        run: cargo test -p jocky-parser

      - name: unit tests — AST
        run: cargo test -p jocky-ast

      - name: unit tests — semantic analyser
        run: cargo test -p jocky-semantic

      - name: unit tests — IR
        run: cargo test -p jocky-ir

      - name: unit tests — HIR
        run: cargo test -p jocky-hir

      - name: unit tests — MIR
        run: cargo test -p jocky-mir

      - name: unit tests — runtime evidence
        run: cargo test -p jocky-runtime-evidence

      - name: integration tests — LotL suite (fast path)
        run: cargo test -p jocky-runtime-lotl --test integration

      - name: unit tests — runtime process
        run: cargo test -p jocky-runtime-process

      - name: unit tests — runtime network
        run: cargo test -p jocky-runtime-network

      - name: unit tests — runtime filesystem
        run: cargo test -p jocky-runtime-filesystem

      - name: unit tests — runtime memory
        run: cargo test -p jocky-runtime-memory

      - name: unit tests — runtime system
        run: cargo test -p jocky-runtime-system

      - name: unit tests — runtime drivers
        run: cargo test -p jocky-runtime-drivers

      - name: unit tests — runtime capabilities
        run: cargo test -p jocky-runtime-capabilities

      - name: unit tests — shared-types
        run: cargo test -p jocky-shared-types

  # ══════════════════════════════════════════════════════════════════════════════
  # LotL deep-dive — every function group called out explicitly
  # ══════════════════════════════════════════════════════════════════════════════
  lotl-deep:
    name: LotL Deep Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: LotL — in-memory execution tests
        run: cargo test -p jocky-runtime-lotl --test integration in_memory -- --nocapture

      - name: LotL — PEB resolver & DJB2 hash tests
        run: cargo test -p jocky-runtime-lotl --test integration peb_and_djb2 -- --nocapture

      - name: LotL — direct syscall stub tests
        run: cargo test -p jocky-runtime-lotl --test integration direct_syscalls -- --nocapture

      - name: LotL — API unhooking tests
        run: cargo test -p jocky-runtime-lotl --test integration api_unhooking -- --nocapture

      - name: LotL — anti-analysis guard tests
        run: cargo test -p jocky-runtime-lotl --test integration anti_analysis -- --nocapture

      - name: LotL — transport configuration tests
        run: cargo test -p jocky-runtime-lotl --test integration transport -- --nocapture

      - name: LotL — Linux memfd tests (kernel path)
        run: cargo test -p jocky-runtime-lotl --test integration linux_memfd -- --nocapture

  # ══════════════════════════════════════════════════════════════════════════════
  # Evidence integrity — focused on the cryptographic pipeline
  # ══════════════════════════════════════════════════════════════════════════════
  evidence-integrity:
    name: Evidence Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Evidence — unit tests (lib)
        run: cargo test -p jocky-runtime-evidence --lib

      - name: Evidence — deep verify integration tests
        run: cargo test -p jocky-runtime-evidence --test deep_verify -- --nocapture

      - name: Evidence — bundle lifecycle integration tests
        run: cargo test -p jocky-runtime-evidence --test evidence_bundle_lifecycle -- --nocapture

  # ══════════════════════════════════════════════════════════════════════════════
  # Gate job — all jobs must pass (use as required status check on main)
  # ══════════════════════════════════════════════════════════════════════════════
  ci-ok:
    name: CI (all checks passed)
    if: always()
    needs:
      - rust-linux
      - rust-windows
      - web
      - debian-package
      - unit-tests-fast
      - lotl-deep
      - evidence-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"result"\s*:\s*"failure"'; then
            echo "One or more CI jobs failed" >&2
            exit 1
          fi
          if echo "$results" | grep -qE '"result"\s*:\s*"cancelled"'; then
            echo "One or more CI jobs were cancelled" >&2
            exit 1
          fi
          echo "All CI jobs passed"
