name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://jockey:jockey_dev@localhost:5432/jockey
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jockey
          POSTGRES_USER: jockey
          POSTGRES_PASSWORD: jockey_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jockey -d jockey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply database schema
        run: psql "$DATABASE_URL" -f migrations/20240101000000_initial_schema.sql
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
