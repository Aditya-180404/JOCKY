[package]
name = "process_triage"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "runtime",
    "runtime/system",
    "runtime/process",
    "runtime/network",
    "runtime/filesystem",
    "runtime/logs",
    "runtime/evidence",
    "runtime/security",
    "runtime/drivers",
    "runtime/timeline",
    "runtime/memory",
    "runtime/registry",
    "runtime/artifacts",
    "runtime/correlation",
    "runtime/capabilities",
    "runtime/auth",
    "runtime/users",
    "runtime/services",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["jocky Team"]
repository = "https://github.com/Aditya-180404/jocky.git"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
ipnetwork = "0.20"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.38", features = ["full"] }
indexmap = { version = "2.0", features = ["serde"] }
bincode = "1.3"
toml = "0.8"

[dependencies]
jocky-runtime = { path = "runtime" }
serde_json = "1.0"
sha2 = "0.10"
