[package]
name = "jockey-api"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "jockey-api"
path = "src/main.rs"

[dependencies]
jockey-shared-types = { path = "../../packages/shared-types" }
jockey-lexer = { path = "../../compiler/lexer" }
jockey-parser = { path = "../../compiler/parser" }
jockey-ast = { path = "../../compiler/ast" }
jockey-semantic = { path = "../../compiler/semantic" }
jockey-backend = { path = "../../compiler/backend" }
jockey-ir = { path = "../../compiler/ir" }
jockey-runtime = { path = "../../runtime" }
jockey-runtime-evidence = { path = "../../runtime/evidence" }
jockey-runtime-system = { path = "../../runtime/system" }
jockey-runtime-process = { path = "../../runtime/process" }
jockey-runtime-network = { path = "../../runtime/network" }
jockey-runtime-filesystem = { path = "../../runtime/filesystem" }
jockey-runtime-logs = { path = "../../runtime/logs" }
jockey-runtime-security = { path = "../../runtime/security" }
jockey-runtime-correlation = { path = "../../runtime/correlation" }
jockey-runtime-timeline = { path = "../../runtime/timeline" }
anyhow = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
validator = { version = "0.16", features = ["derive"] }
ipnetwork = { workspace = true }