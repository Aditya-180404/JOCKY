[package]
name = "jocky-api"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "jocky-api"
path = "src/main.rs"

[dependencies]
jocky-shared-types = { path = "../../packages/shared-types" }
jocky-lexer = { path = "../../compiler/lexer" }
jocky-parser = { path = "../../compiler/parser" }
jocky-ast = { path = "../../compiler/ast" }
jocky-semantic = { path = "../../compiler/semantic" }
jocky-backend = { path = "../../compiler/backend" }
jocky-ir = { path = "../../compiler/ir" }
jocky-runtime = { path = "../../runtime" }
jocky-runtime-evidence = { path = "../../runtime/evidence" }
jocky-runtime-system = { path = "../../runtime/system" }
jocky-runtime-process = { path = "../../runtime/process" }
jocky-runtime-network = { path = "../../runtime/network" }
jocky-runtime-filesystem = { path = "../../runtime/filesystem" }
jocky-runtime-logs = { path = "../../runtime/logs" }
jocky-runtime-security = { path = "../../runtime/security" }
jocky-runtime-correlation = { path = "../../runtime/correlation" }
jocky-runtime-capabilities = { path = "../../runtime/capabilities" }
jocky-runtime-timeline = { path = "../../runtime/timeline" }
anyhow = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
validator = { version = "0.16", features = ["derive"] }
ipnetwork = { workspace = true }