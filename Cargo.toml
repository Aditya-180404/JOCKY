[workspace]
resolver = "2"
members = [
    "compiler/lexer",
    "compiler/parser",
    "compiler/ast",
    "compiler/semantic",
    "compiler/ir",
    "compiler/backend",
    "compiler/cli",
    "runtime",
    "runtime/system",
    "runtime/process",
    "runtime/network",
    "runtime/filesystem",
    "runtime/logs",
    "runtime/evidence",
    "runtime/security",
    "runtime/drivers",
    "runtime/timeline",
    "apps/api",
    "services/compiler-worker",
    "packages/shared-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TraceForge Team"]
repository = "https://github.com/traceforge/traceforge"

[workspace.dependencies]
# Core
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
ipnetwork = "0.20"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "ipnetwork", "migrate"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9.0"
rand = "0.8"

# Web
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Object Storage
aws-sdk-s3 = "1.0"
aws-config = "1.0"

# Compiler
llvm-sys = "180"
inkwell = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization
toml = "0.8"
bincode = "1.3"

# Testing
test-log = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true