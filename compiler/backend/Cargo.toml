[package]
name = "jocky-backend"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[dependencies]
jocky-ast = { path = "../ast" }
jocky-ir = { path = "../ir" }
jocky-hir = { path = "../hir" }
jocky-mir = { path = "../mir" }
jocky-runtime = { path = "../../runtime" }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
llvm-sys = { version = "211.1.0", features = ["prefer-dynamic"], optional = true }

[features]
default = []
llvm = ["llvm-sys"]

[dev-dependencies]
jocky-lexer = { path = "../lexer" }
jocky-parser = { path = "../parser" }
jocky-semantic = { path = "../semantic" }
jocky-runtime-evidence = { path = "../../runtime/evidence" }
