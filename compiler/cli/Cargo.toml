[package]
name = "jockey-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "jockey"
path = "src/main.rs"

[dependencies]
jockey-lexer = { path = "../lexer" }
jockey-parser = { path = "../parser" }
jockey-ast = { path = "../ast" }
jockey-semantic = { path = "../semantic" }
jockey-ir = { path = "../ir" }
jockey-hir = { path = "../hir" }
jockey-mir = { path = "../mir" }
jockey-backend = { path = "../backend" }
jockey-runtime = { path = "../../runtime" }
jockey-runtime-capabilities = { path = "../../runtime/capabilities" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
whoami = "1.6.1"
ureq = { version = "2.10", features = ["json"] }

[features]
default = []
llvm = ["jockey-backend/llvm"]