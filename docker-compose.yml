services:
  # Backend API (Rust/Axum) - jocky compiler API
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      RUST_LOG: info
      JOCKY_BACKEND: rust
      JOCKY_RUNTIME_DIR: /app/runtime
    ports:
      - "8080:8080"
    # Optional: mount source for development
    # volumes:
    #   - ./apps/api:/app/apps/api
    #   - ./compiler:/app/compiler
    #   - ./runtime:/app/runtime
    #   - ./packages/shared-types:/app/packages/shared-types

  # Frontend (React + Vite)
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    # Optional: mount source for development
    # volumes:
    #   - ./apps/web:/app/apps/web
    #   - ./packages/shared-types:/app/packages/shared-types