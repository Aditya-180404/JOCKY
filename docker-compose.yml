services:
  # Backend API (Rust/Axum) - jocky compiler API
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      RUST_LOG: info
      JOCKY_BACKEND: rust
      JOCKY_RUNTIME_DIR: /app/runtime
    expose:
      - "8080"
    # Optional: mount source for development
    # volumes:
    #   - ./apps/api:/app/apps/api
    #   - ./compiler:/app/compiler
    #   - ./runtime:/app/runtime
    #   - ./packages/shared-types:/app/packages/shared-types

  # Frontend (static React app served by Nginx)
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      JOCKY_TLS_HOST: ${JOCKY_TLS_HOST:-localhost}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:3000:80"
    depends_on:
      - api
    # Optional: mount source for development
    # volumes:
    #   - ./apps/web:/app/apps/web
    #   - ./packages/shared-types:/app/packages/shared-types